name: Update Daily Quote

on:
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00) 运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  update-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios

      - name: Update Daily Quote
        run: |
          node -e "
          const axios = require('axios');
          const fs = require('fs');

          // 中英文混合引言库
          const quotes = [
            { text: '代码是诗歌，逻辑是韵律', author: '李沁轩' },
            { text: 'Talk is cheap. Show me the code.', author: 'Linus Torvalds' },
            { text: '千里之行，始于足下', author: '老子' },
            { text: 'Programs must be written for people to read, and only incidentally for machines to execute.', author: 'Harold Abelson' },
            { text: '学而时习之，不亦说乎', author: '孔子' },
            { text: 'First, solve the problem. Then, write the code.', author: 'John Johnson' },
            { text: '博学之，审问之，慎思之，明辨之，笃行之', author: '《礼记》' },
            { text: 'Any fool can write code that a computer can understand. Good programmers write code that humans can understand.', author: 'Martin Fowler' },
            { text: '工欲善其事，必先利其器', author: '孔子' },
            { text: 'Simplicity is the soul of efficiency.', author: 'Austin Freeman' },
            { text: '纸上得来终觉浅，绝知此事要躬行', author: '陆游' },
            { text: 'The best way to predict the future is to implement it.', author: 'David Heinemeier Hansson' },
            { text: '知之者不如好之者，好之者不如乐之者', author: '孔子' },
            { text: 'Code is like humor. When you have to explain it, it\'s bad.', author: 'Cory House' },
            { text: '天行健，君子以自强不息', author: '《周易》' },
            { text: 'Make it work, make it right, make it fast.', author: 'Kent Beck' },
            { text: '海纳百川，有容乃大', author: '林则徐' },
            { text: 'Experience is the name everyone gives to their mistakes.', author: 'Oscar Wilde' },
            { text: '路漫漫其修远兮，吾将上下而求索', author: '屈原' },
            { text: 'The only way to learn a new programming language is by writing programs in it.', author: 'Dennis Ritchie' },
            { text: '不积跬步，无以至千里', author: '荀子' },
            { text: 'Innovation distinguishes between a leader and a follower.', author: 'Steve Jobs' },
            { text: '温故而知新，可以为师矣', author: '孔子' },
            { text: 'Quality is not an act, it is a habit.', author: 'Aristotle' },
            { text: '学而不思则罔，思而不学则殆', author: '孔子' },
            { text: 'The future belongs to those who believe in the beauty of their dreams.', author: 'Eleanor Roosevelt' },
            { text: '博观而约取，厚积而薄发', author: '苏轼' },
            { text: 'Success is not final, failure is not fatal: it is the courage to continue that counts.', author: 'Winston Churchill' },
            { text: '志不强者智不达', author: '墨子' },
            { text: 'The expert in anything was once a beginner.', author: 'Helen Hayes' }
          ];

          // 使用日期作为种子，确保每天内容固定
          const today = new Date().toISOString().split('T')[0];
          const seed = today.split('-').join(''); // YYYYMMDD
          const index = parseInt(seed) % quotes.length;
          const quote = quotes[index];

          // 读取README文件
          const readme = fs.readFileSync('README.md', 'utf8');

          // 查找并替换quote区域
          const quoteStart = '## 💬 Quote of the Day\\n\\n<div align=\"center\">\\n  ';
          const quoteEnd = '\\n</div>';

          // 构建新的quote内容 with background
          const newQuote = '## 💬 Quote of the Day\\n\\n<div align=\"center\">\\n  <div style=\"background: linear-gradient(135deg, #1e3c72, #2a5298); border-radius: 15px; padding: 30px; margin: 20px 0; box-shadow: 0 8px 32px rgba(0,0,0,0.3); position: relative; overflow: hidden;\">\\n    <div style=\"position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent); animation: shimmer 3s infinite;\"></div>\\n    <p style=\"font-size: 20px; font-style: italic; color: #FFFFFF; margin-bottom: 15px; position: relative; z-index: 1; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);\">\\n      💭 \"' + quote.text + '\"\\n    </p>\\n    <p style=\"font-size: 16px; color: #FFD700; margin-top: 10px; position: relative; z-index: 1; font-weight: bold;\">\\n      — ' + quote.author + '\\n    </p>\\n  </div>\\n\\n  <style>\\n    @keyframes shimmer {\\n      0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }\\n      100% { transform: translateX(100%) translateY(100%) rotate(45deg); }\\n    }\\n  </style>\\n</div>';

          // 替换旧的quote内容
          const startMarker = readme.indexOf('## 💬 Quote of the Day');
          const endMarker = readme.indexOf('</div>', startMarker) + 6;

          if (startMarker !== -1 && endMarker !== -1) {
            const newReadme = readme.substring(0, startMarker) + newQuote + readme.substring(endMarker);
            fs.writeFileSync('README.md', newReadme);
            console.log('Daily quote updated successfully!');
            console.log('Quote:', quote.text);
            console.log('Author:', quote.author);
          } else {
            console.log('Quote section not found in README.md');
          }
          "

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🗓️ Update daily quote - $(date +'%Y-%m-%d')"
            git push
          fi