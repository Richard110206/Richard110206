name: Update Daily Quote

on:
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00) 运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  update-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios

      - name: Update Daily Quote
        run: |
          node -e "
          const axios = require('axios');
          const fs = require('fs');

          // 纯英文程序员风格引言库
          const quotes = [
            'One LeetCode Hard a day keeps the doctor away.',
            'Talk is cheap. Show me the code.',
            'First, solve the problem. Then, write the code.',
            'Programs must be written for people to read, and only incidentally for machines to execute.',
            'Any fool can write code that a computer can understand. Good programmers write code that humans can understand.',
            'The best way to predict the future is to implement it.',
            'Code is like humor. When you have to explain it, it\'s bad.',
            'Make it work, make it right, make it fast.',
            'Experience is the name everyone gives to their mistakes.',
            'The only way to learn a new programming language is by writing programs in it.',
            'Innovation distinguishes between a leader and a follower.',
            'Quality is not an act, it is a habit.',
            'The future belongs to those who believe in the beauty of their dreams.',
            'Success is not final, failure is not fatal: it is the courage to continue that counts.',
            'The expert in anything was once a beginner.',
            'Debugging is twice as hard as writing the code in the first place.',
            'Programmer: A machine that turns coffee into code.',
            'There are only 10 types of people in the world: those who understand binary, and those who don\'t.',
            'Software and cathedrals are much the same – first we build them, then we pray.',
            'The only thing standing between you and your goal is the story you keep telling yourself.',
            'If debugging is the process of removing bugs, then programming must be the process of putting them in.',
            'Nine people can\'t make a baby in a month.',
            'A good programmer is someone who always looks both ways before crossing a one-way street.',
            'The most disastrous thing that you can ever learn is your first programming language.',
            'Walking on water and developing software from a specification are easy if both are frozen.',
            'One man\'s crappy software is another man\'s full-time job.',
            'There is no such thing as a good or bad algorithm, only a good or bad implementation.',
            'The best thing about a boolean is even if you are wrong, you are only off by a bit.',
            '99 little bugs in the code. 99 little bugs in the code. Take one down, patch it around. 127 little bugs in the code.',
            'Don\'t worry if it doesn\'t work right. If everything did, you\'d be out of a job.',
            'Software is like entropy: it is constantly increasing, and nothing reduces it except constant effort.',
            'If you can\'t explain it simply, you don\'t understand it well enough.',
            'Premature optimization is the root of all evil.',
            'Simplicity is the soul of efficiency.',
            'The code is not more important than the programmer and their well-being.',
            'Testing can only prove the presence of bugs, not their absence.',
            'The internet? We are not interested in it.',
            '640K ought to be enough for anybody.',
            'I think there is a world market for maybe five computers.',
            'It works on my machine.',
            'Always code as if the guy who ends up maintaining your code will be a violent psychopath who knows where you live.',
            'There are two ways to write error-free programs; only the third one works.',
            'Deleted code is debugged code.',
            'The price of reliability is the pursuit of the utmost simplicity.',
            'Sometimes it pays to stay in bed on Monday, rather than spending the rest of the week debugging Monday\'s code.',
            'In order to be irreplaceable, one must always be different.',
            'Code never lies, comments sometimes do.',
            'Good code is its own best documentation.'
          ];

          // 使用日期作为种子，确保每天内容固定
          const today = new Date().toISOString().split('T')[0];
          const seed = today.split('-').join(''); // YYYYMMDD
          const index = parseInt(seed) % quotes.length;
          const quote = quotes[index];

          // 读取README文件
          const readme = fs.readFileSync('README.md', 'utf8');

          // 查找并替换quote区域
          const quoteStart = '## 💬 Quote of the Day\\n\\n<div align=\"center\">\\n  ';
          const quoteEnd = '\\n</div>';

          // 构建新的quote内容 using external service
          const encodedQuote = encodeURIComponent(quote);
          const newQuote = '## 💬 Quote of the Day\\n\\n<div align=\"center\">\\n\\n  [![Quote Card](https://quotes-github-readme.vercel.app/api?quote=' + encodedQuote + '&theme=radical&type=vertical)](https://github.com/piyushsuthar/github-readme-quotes)\\n\\n</div>';

          // 替换旧的quote内容
          const startMarker = readme.indexOf('## 💬 Quote of the Day');
          const endMarker = readme.indexOf('</div>', startMarker) + 6;

          if (startMarker !== -1 && endMarker !== -1) {
            const newReadme = readme.substring(0, startMarker) + newQuote + readme.substring(endMarker);
            fs.writeFileSync('README.md', newReadme);
            console.log('Daily quote updated successfully!');
            console.log('Quote:', quote.text);
            console.log('Author:', quote.author);
          } else {
            console.log('Quote section not found in README.md');
          }
          "

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🗓️ Update daily quote - $(date +'%Y-%m-%d')"
            git push
          fi